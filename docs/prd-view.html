<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRD — 범용 지도 편집 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl/dist/maplibre-gl.css">
<style>
  :root{
    --bg:#ffffff; --bg-sub:#f7f8fa; --line:#e5e7eb; --line-soft:#f0f1f3;
    --text:#1a1c1f; --text-mut:#6b7280; --accent:#2563eb; --accent-soft:#eff6ff;
    --warn:#b45309; --warn-soft:#fffbeb; --ok:#15803d;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}

  header{
    position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
    padding:0 20px;height:54px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;white-space:nowrap}
  .brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center;
    color:#fff;font:700 12px/1 var(--sans);font-style:normal}
  nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{padding:5px 9px;border-radius:7px;font-size:12.5px;color:var(--text-mut);text-decoration:none;white-space:nowrap}
  nav a:hover{background:var(--bg-sub);color:var(--text)}

  main{display:grid;grid-template-columns:minmax(0,1fr) 480px;height:calc(100vh - 54px)}
  #doc{overflow-y:auto;padding:28px 40px 120px;max-width:none}
  #mapPane{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:var(--bg-sub)}
  #map{flex:1;min-height:0}

  .mapbar{padding:10px 14px;border-bottom:1px solid var(--line);background:#fff}
  .mapbar h3{margin:0 0 3px;font-size:12.5px;font-weight:700}
  .mapbar p{margin:0;font-size:11.5px;color:var(--text-mut);line-height:1.5}
  .mapfoot{padding:9px 14px;border-top:1px solid var(--line);background:#fff;
    display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .mapfoot button{padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:7px;
    font:500 12px/1.4 var(--sans);color:var(--text);cursor:pointer}
  .mapfoot button:hover{background:var(--bg-sub)}
  .mapfoot button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .readout{margin-left:auto;font:11px/1.4 var(--mono);color:var(--text-mut);text-align:right}

  .badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:600;vertical-align:1px}
  .badge.vw{background:var(--accent-soft);color:var(--accent);border:1px solid #bfdbfe}

  /* rendered markdown */
  #doc h1{font-size:26px;margin:0 0 6px;letter-spacing:-.4px}
  #doc h2{font-size:19px;margin:44px 0 12px;padding-top:14px;border-top:1px solid var(--line);letter-spacing:-.3px}
  #doc h2:first-of-type{border-top:none;padding-top:0}
  #doc h3{font-size:15px;margin:26px 0 9px}
  #doc h4{font-size:13.5px;margin:18px 0 6px;color:var(--text-mut)}
  #doc p,#doc li{font-size:13.5px;line-height:1.75}
  #doc blockquote{margin:14px 0;padding:11px 15px;background:var(--accent-soft);
    border-left:3px solid var(--accent);border-radius:0 8px 8px 0}
  #doc blockquote p{margin:4px 0;font-size:12.8px}
  #doc code{font-family:var(--mono);font-size:11.8px;background:var(--bg-sub);
    padding:1.5px 5px;border-radius:5px;border:1px solid var(--line-soft)}
  #doc pre{background:#1a1c1f;color:#e5e7eb;padding:15px 17px;border-radius:10px;overflow-x:auto;font-size:11.8px;line-height:1.65}
  #doc pre code{background:none;border:none;color:inherit;padding:0;font-size:inherit}
  #doc table{border-collapse:collapse;width:100%;margin:14px 0;font-size:12.3px;display:block;overflow-x:auto}
  #doc th,#doc td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;line-height:1.6}
  #doc th{background:var(--bg-sub);font-weight:600;white-space:nowrap}
  #doc td:first-child{white-space:nowrap}
  #doc tr:nth-child(even) td{background:#fcfcfd}
  #doc hr{border:none;border-top:1px solid var(--line);margin:34px 0}
  #doc strong{font-weight:700}
  #doc a{color:var(--accent)}

  .loading{padding:40px;color:var(--text-mut);font-size:13px}
  .err{padding:18px;background:var(--warn-soft);border:1px solid #fde68a;border-radius:10px;
    color:var(--warn);font-size:13px;line-height:1.7}

  .maplibregl-popup-content{font:600 11px/1 var(--sans);padding:4px 8px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.2)}

  @media (max-width:1100px){
    main{grid-template-columns:1fr;height:auto}
    #mapPane{border-left:none;border-top:1px solid var(--line);height:70vh;order:-1;position:sticky;top:54px;z-index:30}
    #doc{padding:22px 18px 80px;height:auto;overflow:visible}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><i>지</i><span>PRD · 지도 편집 플랫폼</span></div>
  <nav id="toc"></nav>
</header>

<main>
  <div id="doc"><div class="loading">PRD.md 불러오는 중…</div></div>

  <div id="mapPane">
    <div class="mapbar">
      <h3>실제 지도 — F-20 동심원 <span class="badge vw">VWorld WMTS</span></h3>
      <p>MapLibre GL + VWorld 실 타일. 중심 서울시청 zoom 12, <code>turf.circle</code> 측지 계산 500 / 1000 / 2000m.
         지도를 클릭하면 그 지점 기준으로 다시 그립니다.</p>
    </div>
    <div id="map"></div>
    <div class="mapfoot">
      <span id="basemaps"></span>
      <button id="btnRings" aria-pressed="true">동심원</button>
      <button id="btnLabels" aria-pressed="true">반경 라벨</button>
      <button id="btnReset">시점 초기화</button>
      <span class="readout" id="readout">—</span>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
/* ---------- 1. PRD 렌더 ---------- */
fetch('PRD.md')
  .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.text() })
  .then(md => {
    const doc = document.getElementById('doc');
    doc.innerHTML = marked.parse(md);
    const toc = document.getElementById('toc');
    doc.querySelectorAll('h2').forEach((h, i) => {
      const id = 'sec' + i; h.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent.replace(/^(\d+)\.\s*/, '$1. ').slice(0, 18);
      toc.appendChild(a);
    });
  })
  .catch(e => {
    document.getElementById('doc').innerHTML =
      '<div class="err"><b>PRD.md 를 읽지 못했습니다 — ' + e.message + '</b><br>' +
      'file:// 로 직접 열면 fetch 가 차단됩니다. 이 폴더에서 <code>python -m http.server</code> 를 띄우고 ' +
      '<code>http://localhost:8000/prd-view.html</code> 로 접속하세요.</div>';
  });

/* ---------- 2. 실제 지도 ---------- */
const CENTER = [126.9780, 37.5665];   // 서울시청
const RADII  = [500, 1000, 2000];     // F-20 기본값 (m)

/* 불변 규칙 4 의 명시적 예외 — VWorld 배경지도 키는 도메인 등록 방식이라
   프록시 뒤로 숨길 수 없고, 타일 URL 에 그대로 들어가는 것이 정상 사용법이다.
   (.env 의 vworld_key 와 같은 값. 지오코딩·검색 API 키는 이 예외에 해당하지 않는다.)

   엔드포인트·레이어명·타일 순서·줌 범위는 추측하지 않았다. 이 키로 받은
   https://api.vworld.kr/req/wmts/1.0.0/{key}/WMTSCapabilities.xml 의 ResourceURL 에서 확인:
     템플릿 .../{layer}/{TileMatrix}/{TileRow}/{TileCol}.{ext}  → z/y/x 순서
     TileMatrixSet=GoogleMapsCompatible (EPSG:3857), 최대 줌 19 (z20 은 InvalidParameter)
     Base·midnight·white·Hybrid = png, Satellite = jpeg
   (확인 필요: 이용약관·상업적 이용 가능 여부는 vworld.kr 원문을 읽지 못해 여전히 미확인 — PRD D-5) */
const VWORLD_KEY = 'B29A6DC8-CA01-46CC-B1BB-8B191EB50AF2';
const vw = (layer, ext) =>
  `https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/${layer}/{z}/{y}/{x}.${ext}`;

// 위성은 라벨이 없어 Hybrid 를 겹쳐야 지명이 보인다 → 배경지도 1개 = 래스터 레이어 n개
const BASEMAPS = [
  { id: 'Base',      label: '일반', urls: [vw('Base', 'png')] },
  { id: 'Satellite', label: '위성', urls: [vw('Satellite', 'jpeg'), vw('Hybrid', 'png')] },
  { id: 'midnight',  label: '야간', urls: [vw('midnight', 'png')] }
];
const VW_ATTRIB = '&copy; <a href="https://www.vworld.kr/" target="_blank">VWorld</a> 국토교통부';

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    // 반경 라벨(symbol 레이어)은 글리프 없이는 렌더되지 않는다.
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: {},
    layers: []
  },
  center: CENTER,
  zoom: 12
});

let activeBasemap = null;
function setBasemap(id) {
  if (activeBasemap) activeBasemap.urls.forEach((_, i) => {
    map.removeLayer('bm' + i);
    map.removeSource('bm' + i);
  });
  const bm = BASEMAPS.find(b => b.id === id);
  bm.urls.forEach((url, i) => {
    map.addSource('bm' + i, {
      type: 'raster', tiles: [url], tileSize: 256, maxzoom: 19, attribution: VW_ATTRIB
    });
    // 동심원보다 아래에 깔린다 (초기 호출 시점엔 rings 가 아직 없다)
    map.addLayer({ id: 'bm' + i, type: 'raster', source: 'bm' + i },
                 map.getLayer('rings-fill') ? 'rings-fill' : undefined);
  });
  activeBasemap = bm;
  document.querySelectorAll('#basemaps button')
    .forEach(b => b.setAttribute('aria-pressed', String(b.dataset.bm === id)));
}

BASEMAPS.forEach(bm => {
  const b = document.createElement('button');
  b.textContent = bm.label;
  b.dataset.bm = bm.id;
  b.onclick = () => setBasemap(bm.id);
  document.getElementById('basemaps').appendChild(b);
});

map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 110, unit: 'metric' }), 'bottom-left');
map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }), 'top-right');

// 불변 규칙 2 — 측지 계산. 픽셀 기반 원을 쓰지 않는다.
function buildRings(center, radii) {
  return {
    type: 'FeatureCollection',
    features: radii.map(r => {
      const poly = turf.circle(center, r, { units: 'meters', steps: 64 });
      poly.properties = { radius: r, label: r >= 1000 ? (r / 1000) + 'km' : r + 'm' };
      return poly;
    })
  };
}
function ringLabels(center, radii) {
  return {
    type: 'FeatureCollection',
    features: radii.map(r => {
      const north = turf.destination(center, r, 0, { units: 'meters' });
      north.properties = { label: r >= 1000 ? (r / 1000) + 'km' : r + 'm' };
      return north;
    })
  };
}

map.on('load', () => {
  setBasemap('Base');

  map.addSource('rings', { type: 'geojson', data: buildRings(CENTER, RADII) });
  map.addSource('ringLabels', { type: 'geojson', data: ringLabels(CENTER, RADII) });
  map.addSource('center', {
    type: 'geojson',
    data: { type: 'Feature', geometry: { type: 'Point', coordinates: CENTER },
            properties: { title: '서울시청' } }
  });

  map.addLayer({
    id: 'rings-fill', type: 'fill', source: 'rings',
    paint: {
      'fill-color': ['interpolate', ['linear'], ['get', 'radius'],
                     500, '#2563eb', 1000, '#7c3aed', 2000, '#db2777'],
      'fill-opacity': 0.10
    }
  });
  map.addLayer({
    id: 'rings-line', type: 'line', source: 'rings',
    paint: {
      'line-color': ['interpolate', ['linear'], ['get', 'radius'],
                     500, '#2563eb', 1000, '#7c3aed', 2000, '#db2777'],
      'line-width': 2
    }
  });
  map.addLayer({
    id: 'ring-labels', type: 'symbol', source: 'ringLabels',
    layout: { 'text-field': ['get', 'label'], 'text-font': ['Noto Sans Regular'],
              'text-size': 12, 'text-offset': [0, -0.6], 'text-allow-overlap': true },
    paint: { 'text-color': '#1a1c1f', 'text-halo-color': '#fff', 'text-halo-width': 2 }
  });
  map.addLayer({
    id: 'center-pt', type: 'circle', source: 'center',
    paint: { 'circle-radius': 7, 'circle-color': '#2563eb',
             'circle-stroke-width': 2.5, 'circle-stroke-color': '#fff' }
  });

  updateReadout();
});

/* 좌표·줌 표시 — PRD 5.1 와이어프레임의 좌표 표시 */
const readout = document.getElementById('readout');
function updateReadout() {
  const c = map.getCenter();
  readout.textContent = c.lng.toFixed(5) + ', ' + c.lat.toFixed(5) + '  z' + map.getZoom().toFixed(1);
}
map.on('move', updateReadout);

/* 토글 */
const RING_LAYERS = ['rings-fill', 'rings-line'];
function toggle(btn, layers) {
  const on = btn.getAttribute('aria-pressed') !== 'true';
  btn.setAttribute('aria-pressed', String(on));
  layers.forEach(id => {
    if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none');
  });
}
document.getElementById('btnRings').onclick  = e => toggle(e.currentTarget, RING_LAYERS);
document.getElementById('btnLabels').onclick = e => toggle(e.currentTarget, ['ring-labels']);
document.getElementById('btnReset').onclick  = () => map.flyTo({ center: CENTER, zoom: 12, bearing: 0, pitch: 0 });

/* 지도를 클릭하면 그 자리에 동심원을 다시 그린다 — F-20 의 "지도 클릭 지점 기준" 경로 */
map.on('click', e => {
  const c = [e.lngLat.lng, e.lngLat.lat];
  map.getSource('rings').setData(buildRings(c, RADII));
  map.getSource('ringLabels').setData(ringLabels(c, RADII));
  map.getSource('center').setData({
    type: 'Feature', geometry: { type: 'Point', coordinates: c }, properties: {}
  });
});
</script>
</body>
</html>
